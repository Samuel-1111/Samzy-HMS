name: Samzy HMS frontend checks
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Summarize dependency audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log("AUDIT SUMMARY", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(name, JSON.stringify({severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,range:x.range})}));'
      - name: Commit generated npm lockfile
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          if [ -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: sync npm lockfile [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
